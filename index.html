<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réseau des lectures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Réseau des lectures</h1>
    <span id="badge" class="badge" hidden>version locale</span>
    <div class="views" role="group" aria-label="Vue">
      <button type="button" data-view="graph" aria-pressed="true">Graphe</button>
      <button type="button" data-view="timeline" aria-pressed="false">Chronologie</button>
      <button type="button" data-view="list" aria-pressed="false">Liste</button>
    </div>
    <span id="count" class="count"></span>
    <input id="search" type="search" placeholder="Rechercher un titre, un auteur…" aria-label="Rechercher">
    <button id="toggle-filters" type="button" aria-expanded="false" aria-controls="filters">Filtres</button>
    <button id="relayout" type="button" title="Recalculer la disposition des nœuds visibles">Réorganiser</button>
    <button id="export" type="button" title="Enregistrer la vue (image PNG, ou tableau CSV en vue Liste)">Exporter</button>
    <a id="open-full" class="open-full" target="_blank" rel="noopener" title="Ouvrir le site complet dans un nouvel onglet" hidden>Plein écran ↗</a>
  </header>

  <div class="main">
    <aside id="filters" class="filters" aria-label="Filtres">
      <section>
        <h2>Couleur des papiers</h2>
        <select id="color-by" aria-label="Couleur des papiers"></select>
      </section>
      <section>
        <h2>Années</h2>
        <div class="years">
          <input id="year-min" type="range" aria-label="Année minimale">
          <input id="year-max" type="range" aria-label="Année maximale">
          <output id="year-out"></output>
        </div>
      </section>
      <section>
        <h2>Citations</h2>
        <select id="min-citations" aria-label="Nombre minimal de citations">
          <option value="0">toutes</option>
          <option value="10">au moins 10</option>
          <option value="50">au moins 50</option>
          <option value="100">au moins 100</option>
          <option value="500">au moins 500</option>
        </select>
      </section>
      <div id="facets"></div>
      <section>
        <h2>Mots-clés</h2>
        <div class="mode" role="group" aria-label="Combinaison des mots-clés">
          <label><input type="radio" name="mode" value="all" checked> tous</label>
          <label><input type="radio" name="mode" value="any"> au moins un</label>
          <button id="reset" type="button">Tout effacer</button>
        </div>
        <div id="keyword-groups"></div>
      </section>
    </aside>

    <div class="stage">
      <div id="isolation" class="isolation" hidden></div>
      <div class="canvas">
        <div id="graph" role="img" aria-label="Graphe des papiers et de leurs mots-clés"></div>
        <div class="zoom" role="group" aria-label="Zoom">
          <button id="zoom-in" type="button" title="Zoomer (+)" aria-label="Zoomer">+</button>
          <button id="zoom-out" type="button" title="Dézoomer (-)" aria-label="Dézoomer">−</button>
          <button id="zoom-fit" type="button" title="Tout afficher (0)" aria-label="Tout afficher">⤢</button>
        </div>
        <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="false" aria-controls="legend" hidden>Légende</button>
        <div id="legend" class="legend" aria-label="Légende">
          <div id="legend-families" class="legend-row"></div>
          <div id="legend-papers" class="legend-row"></div>
        </div>
        <div id="list" class="list" hidden></div>
        <p id="message" class="message" hidden></p>
      </div>
    </div>

    <aside id="panel" class="panel" aria-label="Détails" hidden>
      <button id="close-panel" class="close" type="button" aria-label="Fermer">×</button>
      <div id="panel-body"></div>
    </aside>
  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Figure agrandie">
    <div class="lightbox-bar">
      <button id="figure-prev" type="button" aria-label="Figure précédente">‹</button>
      <span id="figure-position"></span>
      <button id="figure-next" type="button" aria-label="Figure suivante">›</button>
      <a id="figure-open" target="_blank" rel="noopener">Ouvrir l'image</a>
      <button id="figure-close" type="button" aria-label="Fermer">×</button>
    </div>
    <img id="figure-image" alt="">
    <p id="figure-caption"></p>
    <p id="figure-credit" class="credit"></p>
  </dialog>

  <script src="vendor/cytoscape-3.33.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
