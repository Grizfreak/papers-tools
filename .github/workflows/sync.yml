name: Synchro Notion et déploiement

on:
  schedule:
    # Tous les jours à 5 h UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_PATH: ${{ secrets.SITE_PATH }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Un fork sans secrets s'arrête ici avec un message clair
      - name: Vérifier les secrets
        run: |
          missing=""
          for name in NOTION_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_PATH; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing (voir la section Mise en ligne du README)."
            exit 1
          fi
          if ! [[ "$SITE_PATH" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then
            echo "::error::SITE_PATH doit compter au moins 16 caractères parmi A-Z, a-z, 0-9, _ et -."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Régénérer public.json depuis Notion
        run: python scripts/sync_notion.py --public-only

      - name: Vérifier la liste blanche
        run: python scripts/check_public.py

      # Le site vit sous un dossier secret ; la racine du domaine ne sert qu'un 404
      - name: Assembler le site
        run: |
          site="_site/$SITE_PATH"
          mkdir -p "$site/data"
          cp index.html app.js style.css "$site/"
          cp -r vendor "$site/"
          cp data/public.json "$site/data/"
          cp deploy/_headers _site/
          python scripts/check_public.py "$site/data/public.json"

      # La sortie de wrangler liste les fichiers envoyés, donc le chemin secret : on la tait
      - name: Déployer sur Cloudflare
        run: |
          if npx --yes wrangler@4.155.0 deploy > wrangler.log 2>&1; then
            echo "Site déployé."
          else
            echo "::error::Échec du déploiement. Dernières lignes, chemin secret masqué :"
            tail -n 20 wrangler.log | sed "s#$SITE_PATH#<SITE_PATH>#g"
            exit 1
          fi
